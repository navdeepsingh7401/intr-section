<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Intro section with dropdown navigation</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="Snap home">snap</div>

        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
          <img src="./images/icon-menu.svg" alt="" width="32" height="32" />
        </button>

        <div class="nav-wrap" id="site-nav">
          <button class="close-menu" type="button" aria-label="Close menu">
            <img src="./images/icon-close-menu.svg" alt="" width="24" height="24" />
          </button>

          <nav class="main-nav" aria-label="Main navigation">
            <ul class="nav-list">
              <li class="nav-item">
                <button class="nav-trigger" type="button" aria-expanded="false">
                  <span>Features</span>
                  <img class="chevron" src="./images/icon-arrow-down.svg" alt="" aria-hidden="true" />
                </button>
                <ul class="dropdown-menu" aria-label="Features submenu">
                  <li>
                    <a href="#">
                      <img src="./images/icon-todo.svg" alt="" aria-hidden="true" />
                      <span>Todo List</span>
                    </a>
                  </li>
                  <li>
                    <a href="#">
                      <img src="./images/icon-calendar.svg" alt="" aria-hidden="true" />
                      <span>Calendar</span>
                    </a>
                  </li>
                  <li>
                    <a href="#">
                      <img src="./images/icon-reminders.svg" alt="" aria-hidden="true" />
                      <span>Reminders</span>
                    </a>
                  </li>
                  <li>
                    <a href="#">
                      <img src="./images/icon-planning.svg" alt="" aria-hidden="true" />
                      <span>Planning</span>
                    </a>
                  </li>
                </ul>
              </li>

              <li class="nav-item">
                <button class="nav-trigger" type="button" aria-expanded="false">
                  <span>Company</span>
                  <img class="chevron" src="./images/icon-arrow-down.svg" alt="" aria-hidden="true" />
                </button>
                <ul class="dropdown-menu" aria-label="Company submenu">
                  <li><a href="#">History</a></li>
                  <li><a href="#">Our Team</a></li>
                  <li><a href="#">Blog</a></li>
                </ul>
              </li>

              <li class="nav-item">
                <a class="nav-trigger plain-link" href="#">Careers</a>
              </li>

              <li class="nav-item">
                <a class="nav-trigger plain-link" href="#">About</a>
              </li>
            </ul>

            <div class="nav-actions">
              <a href="#">Login</a>
              <a class="register" href="#">Register</a>
            </div>
          </nav>
        </div>
      </header>

      <main class="hero">
        <section class="hero-copy" aria-labelledby="hero-title">
          <h1 id="hero-title">Make <span>remote work</span></h1>
          <p>
            Get your team in sync, no matter your location. Streamline processes,
            create team rituals, and watch productivity soar.
          </p>

          <div class="hero-actions">
            <button class="primary-btn" type="button">Learn more</button>
          </div>

          <ul class="brand-list" aria-label="Client brands">
            <li><img src="./images/client-databiz.svg" alt="Databiz" /></li>
            <li><img src="./images/client-audiophile.svg" alt="Audiophile" /></li>
            <li><img src="./images/client-meet.svg" alt="Meet" /></li>
            <li><img src="./images/client-maker.svg" alt="Maker" /></li>
          </ul>
        </section>

        <section class="hero-visual" aria-label="Hero illustration">
          <img class="hero-art" src="./images/image-hero-desktop.png" alt="A person working on a laptop while collaborating remotely" />
        </section>
      </main>
    </div>

    <div class="body-overlay" aria-hidden="true"></div>

    <script src="./script.js"></script>
  </body>
</html>
